[package]
name = "projectimer-app-dx"
version = "0.1.0"
authors = ["OkiMusix05 <okimusix.business@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
icons = { version = "0.18.3", features = ["dioxus"] }
tw_merge = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.1", features = ["sqlite", "runtime-tokio", "macros"] }
strum = "0.28.0"
tokio = "1.53.1"
tracing = "0.1.44"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
